[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgx-spark-llm-lab"
version = "0.1.0"
description = "Find the best configuration for your daily-driver LLM — then keep it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.0,<4",
    "aiohttp>=3.13.5,<4",
]

[tool.setuptools.packages.find]
include = ["benchkit*"]

[project.scripts]
bench = "benchkit.cli:main"

[tool.ruff]
target-version = "py310"
exclude = ["results/"]
line-length = 100

[tool.coverage.run]
source = ["benchkit"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[tool.mypy]
exclude = ["results/"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "mypy>=2.3.1",
    "pip-audit>=2.0",
    "ruff==0.6.9",
]
