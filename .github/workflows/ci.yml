name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Run ruff check
        run: uv run ruff check .

      # The launchers are the deployment artifact: `./bench apply` copies one
      # into place and systemd execs it. SC2215/SC1143 catch the truncated
      # `docker run` that took the endpoint down on 2026-08-24 (see
      # tests/test_launcher_scripts.py). shellcheck ships on ubuntu-latest.
      - name: Lint shell launchers (shellcheck)
        run: shellcheck --severity=warning $(git ls-files '*.sh')

      - name: Run mypy
        run: uv run mypy benchkit router.py --ignore-missing-imports

      - name: Audit dependencies (pip-audit)
        run: uv run pip-audit -r requirements.txt

      - name: Run unit tests with coverage
        run: uv run coverage run --source=benchkit --parallel-mode -m unittest discover -s tests -t .

      - name: Run bench validate with coverage
        run: uv run coverage run --source=benchkit --parallel-mode -m benchkit.cli validate

      - name: Run bench validate agentic-all with coverage
        run: uv run coverage run --source=benchkit --parallel-mode -m benchkit.cli validate --suite agentic-all

      - name: Combine and report coverage
        run: |
          uv run coverage combine
          uv run coverage report
